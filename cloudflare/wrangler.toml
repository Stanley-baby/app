# The top-level (no --env) configuration is the isolated local environment.
name = "raindrop-api-local"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "local"
VERSION = "0.1.0-local"
API_ORIGIN = "http://localhost:8787"
APP_ORIGIN = "http://localhost:2000"
AI_PAGE_ORIGIN = "http://localhost:5173/ai"
CORS_ORIGINS = "http://localhost:2000 http://127.0.0.1:2000 http://localhost:3000 chrome-extension://*"
MAIL_PROVIDER = "resend"
TURNSTILE_ENABLED = "false"
USAGE_QUOTA_DAILY = "1000"
RATE_LIMIT_PER_MINUTE = "60"

[[d1_databases]]
binding = "DB"
database_name = "raindrop-db-local"
database_id = "REPLACE_WITH_LOCAL_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "raindrop-content-local"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "raindrop-backup-local"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "raindrop-tasks-local"

[[queues.producers]]
binding = "TASK_DLQ"
queue = "raindrop-tasks-dlq-local"

[[queues.consumers]]
queue = "raindrop-tasks-local"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "raindrop-tasks-dlq-local"

[ai]
binding = "AI"

