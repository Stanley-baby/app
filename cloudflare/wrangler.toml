# Copy this file to wrangler.private.toml for a local deployment and replace
# every placeholder with resources owned by your Cloudflare account.
# The top-level (no --env) configuration is the isolated local environment.
name = "raindrop-api-local"
main = "src/index.js"
compatibility_date = "2026-08-31"
workers_dev = true

[browser]
binding = "BROWSER"

[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "local"
VERSION = "0.1.0-local"
API_ORIGIN = "http://localhost:8787"
APP_ORIGIN = "http://localhost:2000"
AI_PAGE_ORIGIN = "http://localhost:2000/ai"
CORS_ORIGINS = "http://localhost:2000 http://127.0.0.1:2000 http://localhost:3000 chrome-extension://*"
MAIL_PROVIDER = "resend"
TURNSTILE_ENABLED = "false"
USAGE_QUOTA_DAILY = "1000"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
RATE_LIMIT_PER_MINUTE = "60"
FETCH_DNS_RESOLVER = "https://cloudflare-dns.com/dns-query"
ATTACHMENT_MAX_BYTES = "52428800"
ATTACHMENT_SCAN_ENABLED = "true"
MIGRATION_MAX_BYTES = "2097152"
BACKUP_RETENTION_DAILY = "30"
BACKUP_RETENTION_MONTHLY = "12"
BACKUP_MAX_BYTES = "16777216"

[[d1_databases]]
binding = "DB"
database_name = "raindrop-db-local"
database_id = "REPLACE_WITH_LOCAL_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "raindrop-content-local"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "raindrop-backup-local"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "raindrop-tasks-local"

[[queues.producers]]
binding = "TASK_DLQ"
queue = "raindrop-tasks-dlq-local"

[[queues.consumers]]
queue = "raindrop-tasks-local"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "raindrop-tasks-dlq-local"

[ai]
binding = "AI"

