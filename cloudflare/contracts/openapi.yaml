openapi: 3.0.3
info:
  title: Independent Bookmarking Service API
  version: 1.0.0
servers:
  - url: https://api.raindrop.io
paths:
  /health:
    get:
      responses:
        '200':
          description: Worker is healthy.
  /version:
    get:
      responses:
        '200':
          description: Deployed Worker version.
  /v1/auth/email/signup:
    post:
      responses:
        '201':
          description: Unverified User created and confirmation email sent.
        '400':
          description: Validation or Turnstile failure.
        '403':
          description: Beta Access Password rejected.
  /v1/auth/email/login:
    post:
      responses:
        '200':
          description: Device session cookie created.
        '401':
          description: Invalid credentials.
  /v1/auth/email/confirm:
    post:
      responses:
        '200':
          description: Email verified.
  /v1/auth/google:
    get:
      responses:
        '302':
          description: Redirect to Google consent.
    post:
      responses:
        '200':
          description: Authorize a Beta Google signup and return the consent URL.
        '403':
          description: Beta Access Password rejected.
  /v1/auth/google/callback:
    get:
      responses:
        '303':
          description: Complete a Google sign-in or connection.
  /v1/sessions:
    get:
      responses:
        '200':
          description: Current User device sessions.
        '401':
          description: Login required.
  /v1/raindrop:
    post:
      responses:
        '201':
          description: Basic Bookmark created for the signed-in User.
        '401':
          description: Login required.
  /v1/raindrop/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      responses:
        '200':
          description: Bookmark with its numeric Resource ID and Change Version.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
    put:
      responses:
        '200':
          description: Bookmark updated with the winning Change Version.
        '400':
          description: Invalid Bookmark fields.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
    delete:
      responses:
        '200':
          description: Bookmark moved to the Recycle Bin and a Change Version emitted.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
  /v1/raindrops:
    post:
      responses:
        '201':
          description: Multiple Bookmarks created with one Change Version per item.
        '400':
          description: Invalid Bookmark batch.
        '401':
          description: Login required.
  /v1/raindrops/{collectionId}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
      - in: query
        name: version
        required: false
        description: Return only the latest state for Bookmarks changed after this Change Version.
        schema:
          type: integer
          minimum: 0
    get:
      responses:
        '200':
          description: Bookmark list and the current lastAction/version marker.
        '400':
          description: Invalid Change Version.
        '401':
          description: Login required.
  /v1/raindrops/changes:
    get:
      parameters:
        - in: query
          name: since
          required: true
          description: Return the latest state for each Bookmark changed after this Change Version.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Incremental Bookmark changes and the current marker.
        '400':
          description: A non-negative Change Version is required.
        '401':
          description: Login required.
  /v1/collection/{id}/lastAction:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Monotonic lastAction timestamp and numeric Change Version.
        '401':
          description: Login required.
  /v1/user:
    get:
      responses:
        '200':
          description: Authenticated User.
        '401':
          description: Login required.
  /v1/user/connect/google:
    get:
      responses:
        '302':
          description: Redirect to Google consent to connect an identity.
  /v1/user/connect/google/revoke:
    post:
      responses:
        '200':
          description: Disconnect Google from the authenticated User.
        '403':
          description: Browser origin is not the configured Web app.
        '409':
          description: Another sign-in method is required before disconnecting Google.
  /v1/user/deletion:
    get:
      responses:
        '200':
          description: Current deletion-window status.
    post:
      responses:
        '202':
          description: Thirty-day deletion window scheduled.
        '409':
          description: Shared collections require explicit resolution first.
    delete:
      responses:
        '200':
          description: Scheduled deletion cancelled.
