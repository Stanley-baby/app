openapi: 3.0.3
info:
  title: Independent Bookmarking Service API
  version: 1.0.0
servers:
  - url: https://api.raindrop.io
components:
  responses:
    InternalError:
      description: Unexpected API failure; the response contains no exception details or User content.
      content:
        application/json:
          schema:
            type: object
            required: [result, error, errorMessage]
            properties:
              result: {type: boolean, enum: [false]}
              error: {type: string, enum: [internal_error]}
              errorMessage: {type: string, enum: [Internal server error]}
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: rd_session
x-error-alerts:
  api_error:
    response: internal_error
    metadata: [code, status]
    redacted: true
paths:
  /health:
    get:
      responses:
        '200':
          description: Worker is healthy.
  /version:
    get:
      responses:
        '200':
          description: Deployed Worker version.
  /v1/auth/email/signup:
    post:
      security: []
      responses:
        '201':
          description: Unverified User created and confirmation email sent.
        '400':
          description: Validation or Turnstile failure.
        '403':
          description: Beta Access Password rejected.
        '409':
          description: Conflict or pending operation.
        '502':
          description: Upstream delivery failed.
        '503':
          description: Service is temporarily unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/email/login:
    post:
      security: []
      responses:
        '200':
          description: Device session cookie created.
        '401':
          description: Invalid credentials.
        '503':
          description: Service is temporarily unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/email/confirm:
    post:
      security: []
      responses:
        '200':
          description: Email verified.
        '400':
          description: Invalid request validation.
        '503':
          description: Service is temporarily unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/google:
    get:
      security: []
      responses:
        '302':
          description: Redirect to Google consent.
        '503':
          description: Service is temporarily unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      security: []
      responses:
        '200':
          description: Authorize a Beta Google signup and return the consent URL.
        '403':
          description: Beta Access Password rejected.
        '503':
          description: Service is temporarily unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/google/callback:
    get:
      security: []
      responses:
        '303':
          description: Complete a Google sign-in or connection.
        '503':
          description: Service is temporarily unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/onedrive/callback:
    get:
      security: []
      responses:
        '303':
          description: Complete a OneDrive connection.
        '503':
          description: Service is temporarily unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/sessions:
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current User device sessions.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/collections/all:
    get:
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: removed
          required: false
          description: Return the signed-in User's Recycle Bin Collections when true.
          schema:
            type: boolean
      responses:
        '200':
          description: Authorized active or removed Collections with numeric Resource IDs and parent IDs.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/collections:
    delete:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: Owned Collections and descendants moved to the Recycle Bin.
        '400':
          description: Invalid Collection IDs.
        '401':
          description: Login required.
        '404':
          description: A Collection is not owned by this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/collections/clean:
    put:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Empty owned Collections permanently removed.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/collection:
    post:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 200
                parentId:
                  oneOf:
                    - type: integer
                      minimum: 0
                    - type: string
                      enum: [root]
                  nullable: true
      responses:
        '201':
          description: Nested or root Collection created for the signed-in User.
        '400':
          description: Invalid Collection title or parent.
        '401':
          description: Login required.
        '404':
          description: Parent Collection is not owned by the User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/collection/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authorized Collection with numeric Resource ID.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                parentId:
                  oneOf:
                    - type: integer
                      minimum: 0
                    - type: string
                      enum: [root]
                  nullable: true
                removed:
                  type: boolean
      responses:
        '200':
          description: Collection title or parent updated.
        '400':
          description: Invalid Collection update.
        '401':
          description: Login required.
        '404':
          description: Collection or parent not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Owned Collection and descendants moved to the Recycle Bin, or the Recycle Bin was permanently cleared for the special -99 ID.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tags/{collectionId}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
    get:
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: tagsSort
          required: false
          schema:
            type: string
            enum: [_id, -count]
      responses:
        '200':
          description: Tags from authorized active Bookmarks.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tags/recent:
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Recently updated authorized Tags.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tags/0:
    put:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, replace]
              properties:
                tag:
                  type: string
                  minLength: 1
                  maxLength: 100
                replace:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '200':
          description: Tag renamed on the User's active Bookmarks.
        '400':
          description: Invalid Tag name.
        '409':
          description: Tag update conflicted with a concurrent Bookmark change.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tag:
    delete:
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: tag
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Tag removed from the User's active Bookmarks.
        '400':
          description: Invalid Tag name.
        '409':
          description: Tag update conflicted with a concurrent Bookmark change.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/filters/{collectionId}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authorized tag filters for a Collection.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrop:
    post:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link:
                  type: string
                  format: uri
                title:
                  type: string
                  maxLength: 500
                description:
                  type: string
                  maxLength: 10000
                excerpt:
                  type: string
                  maxLength: 10000
                note:
                  type: string
                  maxLength: 10000
                collectionId:
                  type: integer
                  minimum: -1
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 100
                highlights:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Basic Bookmark created for the signed-in User.
        '401':
          description: Login required.
        '400':
          description: Invalid request validation.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrop/suggest:
    post:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link, title]
              properties:
                link: {type: string, format: uri}
                title: {type: string, maxLength: 500}
                description: {type: string, maxLength: 10000}
                note: {type: string, maxLength: 10000}
                tags:
                  type: array
                  items: {type: string, maxLength: 100}
      responses:
        '200':
          description: Collection and Tag suggestions for a new Bookmark.
        '400':
          description: Bookmark URL or title is invalid.
        '401':
          description: Login required.
        '429':
          description: Daily AI quota exhausted.
        '404':
          description: Resource not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrop/{id}/suggest:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: integer, minimum: 1}
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Collection and Tag suggestions for an authorized Bookmark.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrop/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Bookmark with its numeric Resource ID and Change Version.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                link:
                  type: string
                  format: uri
                title:
                  type: string
                  maxLength: 500
                description:
                  type: string
                  maxLength: 10000
                excerpt:
                  type: string
                  maxLength: 10000
                note:
                  type: string
                  maxLength: 10000
                collectionId:
                  type: integer
                  minimum: -1
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 100
                highlights:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        type: integer
                        minimum: 1
                      text:
                        type: string
                        maxLength: 10000
                      note:
                        type: string
                        maxLength: 10000
                      color:
                        type: string
                        enum: [yellow, blue, green, red]
                      position: {}
                removed:
                  type: boolean
      responses:
        '200':
          description: Bookmark updated with the winning Change Version.
        '400':
          description: Invalid Bookmark fields.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Bookmark moved to the Recycle Bin and a Change Version emitted.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrop/{id}/highlights.txt:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Plain-text Highlights for the authorized Bookmark.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrop/{id}/highlights.csv:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: CSV Highlights for the authorized Bookmark.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrops:
    post:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [link]
                    properties:
                      link:
                        type: string
                        format: uri
                      title:
                        type: string
                        maxLength: 500
                      description:
                        type: string
                        maxLength: 10000
                      excerpt:
                        type: string
                        maxLength: 10000
                      note:
                        type: string
                        maxLength: 10000
                      collectionId:
                        type: integer
                        minimum: -1
                      tags:
                        type: array
                        items:
                          type: string
                          maxLength: 100
                      highlights:
                        type: array
                        items:
                          type: object
      responses:
        '201':
          description: Multiple Bookmarks created with one Change Version per item.
        '400':
          description: Invalid Bookmark batch.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrops/{collectionId}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
      - in: query
        name: version
        required: false
        description: Return only the latest state for Bookmarks changed after this Change Version.
        schema:
          type: integer
          minimum: 0
      - in: query
        name: search
        required: false
        description: Match only authorized Bookmark title, URL, description, tags, note, or Highlights; Saved-page Snapshot body is excluded.
        schema:
          type: string
      - in: query
        name: page
        required: false
        description: Zero-based page number for Bookmark results.
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: perpage
        required: false
        description: Number of Bookmarks per page; values above 100 are rejected.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 40
      - in: query
        name: dangerAll
        required: false
        description: Required by bulk Bookmark deletion clients.
        schema:
          type: boolean
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Zero-based Bookmark page, total count, and the current lastAction/version marker.
        '400':
          description: Invalid Change Version.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - SessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: Owned active Bookmarks moved to the Recycle Bin, or the -99 Recycle Bin was permanently cleared.
        '400':
          description: Invalid Bookmark IDs.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrops/{collectionId}/export.{format}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
      - in: path
        name: format
        required: true
        schema:
          type: string
          enum: [html, csv, txt, zip]
      - in: query
        name: ids
        required: false
        description: Comma-separated Bookmark IDs; unauthorized IDs are omitted.
        schema:
          type: string
      - in: query
        name: search
        required: false
        schema:
          type: string
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authorized Bookmark export in the requested format.
        '400':
          description: Unsupported Recycle Bin export scope.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Collection not found for this User.
        '413':
          description: Authorized cleared content exceeds the archive limit.
        '503':
          description: Export content could not be read.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/raindrops/changes:
    get:
      security:
        - SessionCookie: []
      parameters:
        - in: query
          name: since
          required: true
          description: Return the latest state for each Bookmark changed after this Change Version.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Incremental Bookmark changes and the current marker.
        '400':
          description: A non-negative Change Version is required.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backup:
    get:
      security:
        - SessionCookie: []
      responses:
        '202':
          description: Private R2 backup queued for the authenticated User.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '503':
          description: Backup could not be queued.
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      security:
        - SessionCookie: []
      responses:
        '202':
          description: Private R2 backup queued for the authenticated User.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '503':
          description: Backup could not be queued.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backups:
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: The authenticated User's completed private restore points.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backup/connections:
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Verified backup destinations without readable credentials.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, credentials]
              properties:
                provider: {type: string, enum: [gdrive, onedrive, webdav]}
                credentials: {type: object}
                default: {type: boolean}
      responses:
        '201': {description: Backup destination independently verified and encrypted credentials saved.}
        '400': {description: Provider or credentials rejected.}
        '401': {description: Login required.}
        '403': {description: Email verification required.}
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backup/connections/gdrive/authorize:
    get:
      security:
        - SessionCookie: []
      responses:
        '302':
          description: Redirect to Google consent for encrypted offline Drive access.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '503':
          description: Google OAuth is not configured.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backup/connections/onedrive/authorize:
    get:
      security:
        - SessionCookie: []
      responses:
        '302':
          description: Redirect to Microsoft consent for encrypted offline OneDrive access.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '503':
          description: Microsoft OAuth is not configured.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backup/connections/{id}/default:
    post:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Default backup destination selected.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Backup destination not found.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backups/{id}:
    get:
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Private backup status.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Backup not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backup/{id}/status:
    get:
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Private backup status.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Backup not found for this User.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/backup/{id}.{format}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: format
        required: true
        schema:
          type: string
          enum: [html, csv, txt, zip]
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authorized private backup export.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Backup or private R2 object not found.
        '409':
          description: Backup is still being created.
        '503':
          description: Private R2 backup could not be read.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/collection/{id}/lastAction:
    get:
      security:
        - SessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Monotonic lastAction timestamp and numeric Change Version.
        '401':
          description: Login required.
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/user:
    get:
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authenticated User.
