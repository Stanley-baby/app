openapi: 3.0.3
info:
  title: Independent Bookmarking Service API
  version: 1.0.0
servers:
  - url: https://api.raindrop.io
paths:
  /health:
    get:
      responses:
        '200':
          description: Worker is healthy.
  /version:
    get:
      responses:
        '200':
          description: Deployed Worker version.
  /v1/auth/email/signup:
    post:
      responses:
        '201':
          description: Unverified User created and confirmation email sent.
        '400':
          description: Validation or Turnstile failure.
        '403':
          description: Beta Access Password rejected.
  /v1/auth/email/login:
    post:
      responses:
        '200':
          description: Device session cookie created.
        '401':
          description: Invalid credentials.
  /v1/auth/email/confirm:
    post:
      responses:
        '200':
          description: Email verified.
  /v1/auth/google:
    get:
      responses:
        '302':
          description: Redirect to Google consent.
    post:
      responses:
        '200':
          description: Authorize a Beta Google signup and return the consent URL.
        '403':
          description: Beta Access Password rejected.
  /v1/auth/google/callback:
    get:
      responses:
        '303':
          description: Complete a Google sign-in or connection.
  /v1/sessions:
    get:
      responses:
        '200':
          description: Current User device sessions.
        '401':
          description: Login required.
  /v1/collections/all:
    get:
      parameters:
        - in: query
          name: removed
          required: false
          description: Return the signed-in User's Recycle Bin Collections when true.
          schema:
            type: boolean
      responses:
        '200':
          description: Authorized active or removed Collections with numeric Resource IDs and parent IDs.
        '401':
          description: Login required.
  /v1/collections:
    delete:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: Owned Collections and descendants moved to the Recycle Bin.
        '400':
          description: Invalid Collection IDs.
        '401':
          description: Login required.
        '404':
          description: A Collection is not owned by this User.
  /v1/collections/clean:
    put:
      responses:
        '200':
          description: Empty owned Collections permanently removed.
        '401':
          description: Login required.
  /v1/collection:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 200
                parentId:
                  oneOf:
                    - type: integer
                      minimum: 0
                    - type: string
                      enum: [root]
                  nullable: true
      responses:
        '201':
          description: Nested or root Collection created for the signed-in User.
        '400':
          description: Invalid Collection title or parent.
        '401':
          description: Login required.
        '404':
          description: Parent Collection is not owned by the User.
  /v1/collection/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      responses:
        '200':
          description: Authorized Collection with numeric Resource ID.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                parentId:
                  oneOf:
                    - type: integer
                      minimum: 0
                    - type: string
                      enum: [root]
                  nullable: true
                removed:
                  type: boolean
      responses:
        '200':
          description: Collection title or parent updated.
        '400':
          description: Invalid Collection update.
        '401':
          description: Login required.
        '404':
          description: Collection or parent not found for this User.
    delete:
      responses:
        '200':
          description: Owned Collection and descendants moved to the Recycle Bin, or the Recycle Bin was permanently cleared for the special -99 ID.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
  /v1/tags/{collectionId}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
    get:
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: tagsSort
          required: false
          schema:
            type: string
            enum: [_id, -count]
      responses:
        '200':
          description: Tags from authorized active Bookmarks.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
  /v1/tags/recent:
    get:
      responses:
        '200':
          description: Recently updated authorized Tags.
        '401':
          description: Login required.
  /v1/tags/0:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, replace]
              properties:
                tag:
                  type: string
                  minLength: 1
                  maxLength: 100
                replace:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '200':
          description: Tag renamed on the User's active Bookmarks.
        '400':
          description: Invalid Tag name.
        '409':
          description: Tag update conflicted with a concurrent Bookmark change.
        '401':
          description: Login required.
  /v1/tag:
    delete:
      parameters:
        - in: query
          name: tag
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Tag removed from the User's active Bookmarks.
        '400':
          description: Invalid Tag name.
        '409':
          description: Tag update conflicted with a concurrent Bookmark change.
        '401':
          description: Login required.
  /v1/filters/{collectionId}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
    get:
      responses:
        '200':
          description: Authorized tag filters for a Collection.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
  /v1/raindrop:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link:
                  type: string
                  format: uri
                title:
                  type: string
                  maxLength: 500
                description:
                  type: string
                  maxLength: 10000
                excerpt:
                  type: string
                  maxLength: 10000
                note:
                  type: string
                  maxLength: 10000
                collectionId:
                  type: integer
                  minimum: -1
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 100
                highlights:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Basic Bookmark created for the signed-in User.
        '401':
          description: Login required.
  /v1/raindrop/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      responses:
        '200':
          description: Bookmark with its numeric Resource ID and Change Version.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                link:
                  type: string
                  format: uri
                title:
                  type: string
                  maxLength: 500
                description:
                  type: string
                  maxLength: 10000
                excerpt:
                  type: string
                  maxLength: 10000
                note:
                  type: string
                  maxLength: 10000
                collectionId:
                  type: integer
                  minimum: -1
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 100
                highlights:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        type: integer
                        minimum: 1
                      text:
                        type: string
                        maxLength: 10000
                      note:
                        type: string
                        maxLength: 10000
                      color:
                        type: string
                        enum: [yellow, blue, green, red]
                      position: {}
                removed:
                  type: boolean
      responses:
        '200':
          description: Bookmark updated with the winning Change Version.
        '400':
          description: Invalid Bookmark fields.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
    delete:
      responses:
        '200':
          description: Bookmark moved to the Recycle Bin and a Change Version emitted.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
  /v1/raindrop/{id}/highlights.txt:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      responses:
        '200':
          description: Plain-text Highlights for the authorized Bookmark.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
  /v1/raindrop/{id}/highlights.csv:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      responses:
        '200':
          description: CSV Highlights for the authorized Bookmark.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
  /v1/raindrops:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [link]
                    properties:
                      link:
                        type: string
                        format: uri
                      title:
                        type: string
                        maxLength: 500
                      description:
                        type: string
                        maxLength: 10000
                      excerpt:
                        type: string
                        maxLength: 10000
                      note:
                        type: string
                        maxLength: 10000
                      collectionId:
                        type: integer
                        minimum: -1
                      tags:
                        type: array
                        items:
                          type: string
                          maxLength: 100
                      highlights:
                        type: array
                        items:
                          type: object
      responses:
        '201':
          description: Multiple Bookmarks created with one Change Version per item.
        '400':
          description: Invalid Bookmark batch.
        '401':
          description: Login required.
  /v1/raindrops/{collectionId}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
      - in: query
        name: version
        required: false
        description: Return only the latest state for Bookmarks changed after this Change Version.
        schema:
          type: integer
          minimum: 0
      - in: query
        name: search
        required: false
        description: Match only authorized Bookmark title, URL, description, tags, note, or Highlights; Saved-page Snapshot body is excluded.
        schema:
          type: string
      - in: query
        name: dangerAll
        required: false
        description: Required by bulk Bookmark deletion clients.
        schema:
          type: boolean
    get:
      responses:
        '200':
          description: Bookmark list and the current lastAction/version marker.
        '400':
          description: Invalid Change Version.
        '401':
          description: Login required.
    delete:
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: Owned active Bookmarks moved to the Recycle Bin, or the -99 Recycle Bin was permanently cleared.
        '400':
          description: Invalid Bookmark IDs.
        '401':
          description: Login required.
        '404':
          description: Collection not found for this User.
  /v1/raindrops/{collectionId}/export.{format}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
      - in: path
        name: format
        required: true
        schema:
          type: string
          enum: [html, csv, txt, zip]
      - in: query
        name: ids
        required: false
        description: Comma-separated Bookmark IDs; unauthorized IDs are omitted.
        schema:
          type: string
      - in: query
        name: search
        required: false
        schema:
          type: string
    get:
      responses:
        '200':
          description: Authorized Bookmark export in the requested format.
        '400':
          description: Unsupported Recycle Bin export scope.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Collection not found for this User.
        '413':
          description: Authorized cleared content exceeds the archive limit.
        '503':
          description: Export content could not be read.
  /v1/raindrops/changes:
    get:
      parameters:
        - in: query
          name: since
          required: true
          description: Return the latest state for each Bookmark changed after this Change Version.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Incremental Bookmark changes and the current marker.
        '400':
          description: A non-negative Change Version is required.
        '401':
          description: Login required.
  /v1/backup:
    get:
      responses:
        '202':
          description: Private R2 backup queued for the authenticated User.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '503':
          description: Backup could not be queued.
    post:
      responses:
        '202':
          description: Private R2 backup queued for the authenticated User.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '503':
          description: Backup could not be queued.
  /v1/backups:
    get:
      responses:
        '200':
          description: The authenticated User's completed private restore points.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
  /v1/backup/connections:
    get:
      responses:
        '200':
          description: Verified backup destinations without readable credentials.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
  /v1/backup/connections/gdrive/authorize:
    get:
      responses:
        '302':
          description: Redirect to Google consent for encrypted offline Drive access.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '503':
          description: Google OAuth is not configured.
    post:
      responses:
        '201':
          description: Backup destination independently verified and encrypted credentials saved.
        '400':
          description: Provider or credentials rejected.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
  /v1/backup/connections/{id}/default:
    post:
      responses:
        '200':
          description: Default backup destination selected.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Backup destination not found.
  /v1/backups/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Private backup status.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Backup not found for this User.
  /v1/backup/{id}/status:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Private backup status.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Backup not found for this User.
  /v1/backup/{id}.{format}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: format
        required: true
        schema:
          type: string
          enum: [html, csv, txt, zip]
    get:
      responses:
        '200':
          description: Authorized private backup export.
        '401':
          description: Login required.
        '403':
          description: Email verification required.
        '404':
          description: Backup or private R2 object not found.
        '409':
          description: Backup is still being created.
        '503':
          description: Private R2 backup could not be read.
  /v1/collection/{id}/lastAction:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Monotonic lastAction timestamp and numeric Change Version.
        '401':
          description: Login required.
  /v1/user:
    get:
      responses:
        '200':
          description: Authenticated User.
        '401':
          description: Login required.
  /v1/user/quota:
    get:
      responses:
        '200':
          description: Current daily Usage Quota and its reset time for the authenticated User.
        '401':
          description: Login required.
        '429':
          description: Endpoint rate limit reached; retry after the Retry-After interval.
  /v1/user/connect/google:
    get:
      responses:
        '302':
          description: Redirect to Google consent to connect an identity.
  /v1/user/connect/google/revoke:
    post:
      responses:
        '200':
          description: Disconnect Google from the authenticated User.
        '403':
          description: Browser origin is not the configured Web app.
        '409':
          description: Another sign-in method is required before disconnecting Google.
  /v1/user/deletion:
    get:
      responses:
        '200':
          description: Current deletion-window status.
    post:
      responses:
        '202':
          description: Thirty-day deletion window scheduled.
        '409':
          description: Shared collections require explicit resolution first.
    delete:
      responses:
        '200':
          description: Scheduled deletion cancelled.
  /v1/tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: Authorized Background Task status, progress, retry count, and safe failure details.
        '401':
          description: Login required.
        '404':
          description: Task not found for this User.
  /v1/tasks/{id}/status:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: Authorized Background Task status and progress.
        '401':
          description: Login required.
        '404':
          description: Task not found for this User.
  /v1/tasks/{id}/failure:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: Safe Background Task failure details, or null when it has not failed.
        '401':
          description: Login required.
        '404':
          description: Task not found for this User.
  /v1/tasks/{id}/retry:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    post:
      responses:
        '202':
          description: Failed Background Task queued for an explicit manual retry.
        '400':
          description: Task type cannot be retried.
        '401':
          description: Login required.
        '404':
          description: Task not found for this User.
        '409':
          description: Task is not in a retryable failure state.
  /v1/import/preflight:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Migration Archive containing collections, bookmarks, and inline protected content (attachments, covers, or snapshots).
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Migration Preflight report with duplicate candidates awaiting review.
        '400':
          description: Invalid or empty Migration Archive.
        '413':
          description: Migration Archive exceeds the configured size limit.
  /v1/import:
    get:
      responses:
        '200':
          description: Current User's Migration Archives and Background Task states.
  /v1/import/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: Migration Archive status, duplicate decisions, and resumable task progress.
        '404':
          description: Migration Archive not found for this User.
  /v1/import/{id}/review:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  oneOf:
                    - type: object
                      additionalProperties:
                        type: string
                        enum: [keep, skip]
                    - type: array
                      items:
                        type: object
                        required: [sourceId, decision]
                        properties:
                          sourceId:
                            type: string
                          decision:
                            type: string
                            enum: [keep, skip]
      responses:
        '200':
          description: Duplicate Review decisions saved.
        '400':
          description: Invalid or unknown duplicate decision.
        '409':
          description: Archive is no longer awaiting review.
  /v1/import/{id}/commit:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    post:
      responses:
        '200':
          description: Existing completed Migration Archive returned idempotently.
        '202':
          description: Migration Archive accepted as a resumable Background Task.
        '409':
          description: Duplicate Review is incomplete.
        '503':
          description: Background Task could not be queued.
  /v1/import/{id}/status:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: Current import progress and safe failure details.
  /v1/import/{id}/retry:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    post:
      responses:
        '202':
          description: Failed import task queued for explicit retry.
        '409':
          description: Import task is not in a retryable state.
  /v1/import/{id}/mappings:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: Source identifiers mapped to assigned Resource IDs (numeric for Collections and Bookmarks, opaque for Protected Content).
  /v1/raindrop/file:
    put:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  maxLength: 500
                collectionId:
                  type: integer
                  minimum: -1
                tags:
                  type: string
      responses:
        '201':
          description: Private attachment stored in Quarantined Content.
        '400':
          description: Upload metadata or file is invalid.
        '401':
          description: Login required.
        '403':
          description: Verified email required.
        '413':
          description: Attachment exceeds the 50 MiB Beta limit.
        '503':
          description: Private content storage is unavailable.
  /v1/content/upload:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bookmarkId]
              properties:
                file:
                  type: string
                  format: binary
                bookmarkId:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Private attachment stored in Quarantined Content.
        '400':
          description: Upload metadata or file is invalid.
        '401':
          description: Login required.
        '403':
          description: Verified email required.
        '404':
          description: Bookmark not found for this User.
        '413':
          description: Attachment exceeds the 50 MiB Beta limit.
        '503':
          description: Private content storage or the safety queue is unavailable.
  /v1/raindrop/{id}/attachments:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Private attachment stored in Quarantined Content.
        '400':
          description: Upload metadata or file is invalid.
        '401':
          description: Login required.
        '403':
          description: Verified email required.
        '404':
          description: Bookmark not found for this User.
        '413':
          description: Attachment exceeds the 50 MiB Beta limit.
        '503':
          description: Private content storage or the safety queue is unavailable.
  /v1/raindrop/{id}/content:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Authorized private content metadata for a Bookmark.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
  /v1/raindrop/{id}/capture:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [snapshot, screenshot]
      responses:
        '202':
          description: Explicit Dynamic Capture queued for safety checking.
        '400':
          description: Bookmark URL is not a public HTTP(S) address.
        '401':
          description: Login required.
        '403':
          description: Verified email required.
        '404':
          description: Bookmark not found for this User.
        '503':
          description: Capture task could not be queued.
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Capture and snapshot status for the Bookmark.
        '401':
          description: Login required.
        '404':
          description: Bookmark not found for this User.
  /v1/content/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authorized Protected Content metadata.
        '401':
          description: Login required.
        '404':
          description: Content not found for this User.
  /v1/content/{id}/download:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authorized Cleared Content stream from private R2.
        '401':
          description: Login required.
        '404':
          description: Content not found for this User.
        '409':
          description: Content is still Quarantined.
  /v1/collection/{id}/sharing:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Direct Collaborators and their roles.}
        '401': {description: Login required.}
        '404': {description: Collection not found.}
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [editor, viewer, member]
      responses:
        '201': {description: One-time invitation created.}
        '400': {description: Invalid role.}
        '401': {description: Login required.}
        '403': {description: Editor or Owner access required.}
  /v1/collection/{id}/sharing/{userId}:
    put:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
        - in: path
          name: userId
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [editor, viewer, member]
      responses:
        '200': {description: Collaborator role updated.}
        '400': {description: Invalid role.}
        '401': {description: Login required.}
        '403': {description: Owner access required.}
        '404': {description: Collection or User not found.}
    delete:
      responses:
        '200': {description: Collaborator removed.}
        '401': {description: Login required.}
        '403': {description: Owner access required.}
        '404': {description: Collection or User not found.}
  /v1/collaborators/join:
    get:
      parameters:
        - in: query
          name: token
          required: true
          schema: {type: string}
      responses:
        '200': {description: Invitation accepted.}
        '400': {description: Invitation is invalid or expired.}
        '401': {description: Login required.}
        '404': {description: Collection not found.}
  /v1/collection/{id}/transfer:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: integer, minimum: 1}
      responses:
        '200': {description: Collection ownership transferred explicitly.}
        '400': {description: Invalid target User.}
        '401': {description: Login required.}
        '403': {description: Owner access required.}
        '404': {description: Collection or User not found.}
  /v1/collection/{id}/published-snapshots:
    get:
      responses:
        '200': {description: Published snapshot metadata.}
        '401': {description: Login required.}
        '403': {description: Owner access required.}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentId: {type: string}
                contentIds:
                  type: array
                  items: {type: string}
      responses:
        '200': {description: Cleared snapshot explicitly published.}
        '400': {description: Snapshot validation failed.}
        '401': {description: Login required.}
        '403': {description: Owner access required.}
        '404': {description: Collection or content not found.}
        '409': {description: Snapshot is not Cleared Content.}
  /v1/collection/{id}/published-snapshots/{contentId}:
    delete:
      responses:
        '200': {description: Published snapshot revoked.}
        '401': {description: Login required.}
        '403': {description: Owner access required.}
        '404': {description: Collection or content not found.}
  /v1/content/{id}/publish:
    post:
      responses:
        '200': {description: Cleared snapshot published to its Owner Collection.}
        '400': {description: Snapshot validation failed.}
        '401': {description: Login required.}
        '403': {description: Owner access required.}
        '404': {description: Content not found.}
        '409': {description: Snapshot is not Cleared Content.}
    delete:
      responses:
        '200': {description: Published snapshot revoked.}
        '401': {description: Login required.}
        '403': {description: Owner access required.}
        '404': {description: Content not found.}
  /v1/public/collections/{id}/{slug}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
        - in: path
          name: slug
          required: true
          schema: {type: string}
      responses:
        '200': {description: Public Collection metadata and Bookmark list without private content.}
        '404': {description: Collection is private, removed, or not found.}
  /v1/public/content/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Published Cleared Snapshot stream.}
        '404': {description: Content is not currently published.}
